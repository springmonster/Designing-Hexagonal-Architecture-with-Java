<html>
<head>
    <title>Topology & Inventory | Add Network</title>
    <meta charset="UTF-8">
    <meta content="Topology & Inventory" name="description">
    <link href="css/main.css" rel="stylesheet">
    <script src="js/nav.js"></script>
</head>
<body>
<div class="flex-container">
    <div class="content-container">
        <div class="center">
            <img class="logo" src="images/topology_logo.png">
            <h1 class="neon">Topology & Inventory</h1>
        </div>
        <html-include src="includes/menu.html"></html-include>
        <br>
        <div class="content-container">
            <div class="form-container2 neon-white">
                <div class="text-1">
                    <div class="container">
                        <form name="addNetwork" onsubmit="return false;">
                            <div class="row">
                                <div class="col-75">
                                    <input id="routerId" name="routerId"
                                           placeholder="Enter the router id"
                                           type="text">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-75">
                                    <input id="address" name="address" placeholder="Enter a network address"
                                           type="text">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-75">
                                    <input id="name" name="name" placeholder="Enter a network name" type="text">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-75">
                                    <input id="cidr" name="cidr" placeholder="Enter a network cidr" type="text">
                                </div>
                            </div>
                            <div class="row">
                                <input id="go-button" class="submit-btn" onclick="addNetworkToRouter()" type="submit"
                                       value="Submit">
                            </div>
                        </form>
                    </div>
                    <div id="message"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/d3.v3.min.js"></script>
<script src="js/vtree.js"></script>
<script src="js/networkTools.js"></script>
<script src="js/include.js"></script>
</body>
</html>
